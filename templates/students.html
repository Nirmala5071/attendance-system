<!DOCTYPE html>
<html>
<head>
    <title>Registered Students</title>
</head>
<body>

<h1>Registered Students</h1>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
</tr>

{% for student in students %}

    <td>{{ student[0] }}</td>
    <td>{{ student[1] }}</td>
    <td>{{ student[2] }}</td>
</tr>
{% endfor %}

</table>

<br>
<a href="/">Home</a>

</body>
</html>
