<!DOCTYPE html>
<html>

<head>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Students</h2>

<table class="table table-bordered">

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>

</tr>

{% for s in students %}

<tr>

<td>{{s.id}}</td>
<td>{{s.name}}</td>
<td>{{s.email}}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
