<!DOCTYPE html>
<html>
<head>
    <title>Attendance Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .header{
            background:#0d6efd;
            color:white;
            text-align:center;
            padding:20px;
        }

        .card{
            border:none;
            box-shadow:0px 2px 10px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

    </style>

</head>

<body>

<div class="header">

    <h2>SJC Institute of Technology</h2>

    <h5>Attendance Management System</h5>

</div>

<div class="container mt-5">

    <h1 class="text-center mb-5">
        Attendance Management System
    </h1>

    <div class="row">

        <div class="col-md-3">

            <div class="card p-4 text-center">

                <h3>Students</h3>

                <p>View Student Details</p>

                <a href="/students" class="btn btn-primary">
                    Open
                </a>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card p-4 text-center">

                <h3>Attendance</h3>

                <p>Mark Daily Attendance</p>

                <a href="/attendance" class="btn btn-primary">
                    Open
                </a>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card p-4 text-center">

                <h3>Reports</h3>

                <p>View Attendance Reports</p>

                <a href="/reports" class="btn btn-primary">
                    Open
                </a>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card p-4 text-center">

                <h3>Register</h3>

                <p>Add New Students</p>

                <a href="/register" class="btn btn-primary">
                    Open
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
